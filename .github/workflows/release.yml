name: Package Splunk App

on:
  push:
    tags:
      - v[0-9]+.[0-9]+.[0-9]+

jobs:
  build-and-package:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Set Version ID
        id: version-tag
        run: |
          tag="${GITHUB_REF#refs/*/}"
          echo "version=${tag}" >> $GITHUB_OUTPUT
          echo "semver=${tag#v}" >> $GITHUB_OUTPUT

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python build dependencies
        run: pip install -r requirements-dev.txt

      - name: Install Python runtime dependencies into lib/
        run: pip install -r requirements.txt --target TA-puppet-alert-orchestrator/lib --no-compile

      - name: Build configuration page (UCC)
        run: ucc-gen build --source TA-puppet-alert-orchestrator --ta-version ${{ steps.version-tag.outputs.semver }}

      - name: Normalize file permissions
        run: find output/TA-puppet-alert-orchestrator -type f -exec chmod 644 {} +

      - name: Package app
        run: slim package output/TA-puppet-alert-orchestrator

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ steps.version-tag.outputs.version }} \
            TA-puppet-alert-orchestrator-*.tar.gz \
            --title "${{ steps.version-tag.outputs.version }}" \
            --generate-notes
